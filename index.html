<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">

       
        <img src="picture sample girl.svg.webp" width="800vw">
    <div class="col-md-5 right-box">
        <div class="row align-items-center">
              <div class="input-group mb-3">
                  <input type="text" class="form-control form-control-lg bg-light fs-6" style="height: 55PX;" placeholder="Email address">
              </div>
              <div class="input-group mb-1">
                  <input type="password" class="form-control form-control-lg bg-light fs-6" style="height: 55PX;" placeholder="Password">
              </div>
              <div class="input-group mb-5 d-flex justify-content-between">
                  <div class="form-check">
                      <input type="checkbox" class="form-check-input" id="formCheck">
                      <label for="formCheck" class="form-check-label text-secondary"><small>Remember Me</small></label>
                  </div>
                  <div class="forgot">
                      <a href="#">Forgot Password?</a>
                  </div>
              </div>
              <div class="input-group mb-3">
                  <button class="btn btn-lg btn-primary w-100 fs-6" style="height:60px"><strong>SIGN IN</strong></button>
              </div>
            </div>
            <div class="divider">
                <span class="line"></span>
                <span class="or-text">OR</span>
                <span class="line"></span>
              </div>
              <div class="input-group mb-3">
                
                <button class="btn btn-lg btn-primary w-100 fs-6" style="height:55px" ><strong>CONTINUE WITH FACEBOOK</strong></button><br>
            </div>
              <div class="twit-button">
                  <button class="btn btn-lg w-100 fs-6" style="height:55px" ><strong style="color: white;">CONTINUE WITH TWITTER</strong></button><br>
              </div>
        
        
     </div> 
    </div>
  </div>
  <script src="jquery.js"></script>

  <script>
      $(document).ready(function(){
          $('btn btn-primary 1').click(function(){
var a =$('#num1').val();
var b =$('#num2').val();
if (a == "" || b == ""){
  alert('Please fill the column')
}
else{
  alert('Thank you')
}
          })
      })
  </script>
</body>
</html>
